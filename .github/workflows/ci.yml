name: Build OpenWrt Redmi AX3000 Optimized

on:
  workflow_dispatch:

# 杜绝0秒取消、杜绝抢任务卡死
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出完整源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 缓存编译加速(大幅缩短下次时间)
        uses: actions/cache@v3
        with:
          path: |
            .ccache
            feeds
            dl
          key: ${{ runner.os }}-openwrt-ipq50xx-${{ github.sha }}

      - name: 安装完整官方编译依赖(补齐所有缺库)
        run: |
          sudo apt update -y
          sudo apt install -y build-essential flex bison gawk python3 python3-pip unzip \
          libncurses-dev libssl-dev device-tree-compiler git ccache curl wget file rsync \
          libelf-dev uuid-dev lib32gcc-s1 libc6-dev-i386

      - name: 初始化Feeds纯净流程
        run: |
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 纯净生成配置(不瞎改、不冲突)
        run: |
          rm -f .config .config.old
          make defconfig

      - name: 预下载全部源码(防止中途断网失败)
        run: make download -j$(nproc) V=s

      - name: 开启CCache加速编译
        run: |
          export CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
          ccache -M 10G
          ccache -s

      - name: 正式编译(稳版多核)
        run: make -j$(($(nproc)-1)) V=s

      - name: 上传成品固件bin
        uses: actions/upload-artifact@v4
        with:
          name: RedmiAX3000-Firmware
          path: bin/targets/ipq50xx/generic/*.bin

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: 下载固件
        uses: actions/download-artifact@v4
        with:
          name: RedmiAX3000-Firmware

      - name: 自动打包发布
        uses: softprops/action-gh-release@v1
        with:
          files: "*.bin"
