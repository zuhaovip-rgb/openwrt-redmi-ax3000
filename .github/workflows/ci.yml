name: Build OpenWrt for Redmi AX3000 (IPQ50xx)

# 触发方式：手动触发（可按需添加push自动触发）
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "编译分支"
        default: "ipq50xx-mainline-kernel-5.15-openwrt-23.05"
        required: true
      defconfig:
        description: "是否使用默认配置"
        default: "false"
        required: false

# 🔴 核心修复：关闭并发抢占，禁止新任务取消正在运行的任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 🔴 核心修复：设置最大超时6小时（符合GitHub免费Runner限制，避免无限排队）
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update && sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool libxml2-utils lzma make mingw-w64 ncurses-dev p7zip patch python3 python3-pip \
          python3-pyelftools python3-setuptools rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          unzip wget xml-utils xsltproc zlib1g-dev file

      - name: 初始化编译环境
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载自定义配置（.config）
        run: |
          # 若你有自定义.config，直接放在仓库根目录，这里会自动加载
          if [ -f .config ]; then
            echo "加载自定义.config"
            cat .config > .config
          else
            echo "生成默认配置"
            make defconfig
          fi

      - name: 下载所有源码包（避免编译中断）
        run: make -j$(nproc) download V=s

      - name: 正式编译固件
        run: make -j$(nproc) V=s

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-redmi-ax3000-firmware
          path: bin/targets/ipq50xx/generic/*.bin

  # 可选：编译成功后自动发布Release
  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          name: openwrt-redmi-ax3000-firmware
          path: firmware

      - name: 自动创建Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.sha }}
          name: OpenWrt Redmi AX3000 ${{ github.sha }}
          files: firmware/*.bin
