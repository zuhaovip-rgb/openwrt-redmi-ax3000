name: Build OpenWrt for Redmi AX3000 (IPQ50xx)

# 仅保留手动触发，不改动原触发逻辑
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "编译分支"
        default: "ipq50xx-mainline-kernel-5.15-openwrt-23.05"
        required: true

# 核心修复1：彻底解决0s取消/被抢占问题
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 核心修复2：限制最大运行6小时，符合GitHub免费Runner规则，避免无限排队
    timeout-minutes: 360
    steps:
      - name: 检出代码（完全保留原分支/提交，无任何修改）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: 安装编译依赖（补全所有Passwall依赖所需环境）
        run: |
          sudo apt update && sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool libxml2-utils lzma make mingw-w64 ncurses-dev p7zip patch python3 python3-pip \
          python3-pyelftools python3-setuptools rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          unzip wget xml-utils xsltproc zlib1g-dev file

      - name: 克隆Passwall依赖源（仅在CI中拉取，不修改你原仓库文件）
        run: |
          # 拉取Passwall主源 + 依赖源，完全不改动你本地仓库
          git clone https://github.com/xiaorouji/openwrt-passwall.git package/openwrt-passwall
          git clone https://github.com/xiaorouji/openwrt-passwall-packages.git package/openwrt-passwall-packages

      - name: 更新并安装所有feeds（自动补全Passwall依赖）
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载你原有的.config配置（100%保留你原配置，不做任何修改）
        run: |
          if [ -f .config ]; then
            echo "加载你原有的.config配置，无任何修改"
            cp .config .config.bak
            cat .config.bak > .config
          else
            echo "生成Redmi AX3000默认配置"
            make defconfig
          fi

      - name: 预下载所有源码包（避免网络问题导致编译中断，含Passwall依赖）
        run: make -j$(nproc) download V=s

      - name: 正式编译固件（完整编译Passwall及所有依赖）
        run: make -j$(nproc) V=s

      - name: 上传编译产物（自动保存.bin固件，直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-redmi-ax3000-firmware
          path: bin/targets/ipq50xx/generic/*.bin

  # 保留原release/gh-pages逻辑，仅在build成功后执行，不改动原流程
  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          name: openwrt-redmi-ax3000-firmware
          path: firmware

      - name: 自动创建Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.sha }}
          name: OpenWrt Redmi AX3000 ${{ github.sha }}
          files: firmware/*.bin

  gh-pages:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: 部署gh-pages（完全保留原逻辑，无修改）
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bin/targets/ipq50xx/generic/
