name: Build Openfirmware

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install full build dependencies (修复核心：补全所有OpenWrt必需依赖)
        run: |
          sudo apt update && sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool libxml2-utils lzma make mingw-w64 ncurses-dev p7zip patch python3 python3-pip \
          python3-pyelftools python3-setuptools rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          unzip wget xml-utils xsltproc zlib1g-dev file

      - name: Update & Install feeds (修复核心：先更新源再安装依赖)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Redmi AX3000 default config (修复核心：生成目标设备配置)
        run: |
          make defconfig
          # 强制指定Redmi AX3000 IPQ50xx目标，避免配置错误
          sed -i 's/CONFIG_TARGET_.*=y//g' .config
          echo "CONFIG_TARGET_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_ipq50xx_generic=y" >> .config
          echo "CONFIG_TARGET_ipq50xx_generic_DEVICE_redmi_ax3000=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          make defconfig

      - name: Download all source packages (修复核心：先下载再编译，避免网络中断)
        run: make -j$(nproc) download V=s

      - name: Compile firmware
        run: make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Firmware
          path: bin/targets/ipq50xx/generic/*.bin

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Firmware
          path: ./bin

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./bin/**/*.bin
